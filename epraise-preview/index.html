<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="E.Praise Couture's — the homebase of luxury in Lokoja, Kogi State. Bespoke tailoring, couture and a fabric house of cashmere, jonkoso, tetsi, vucano wool and fine suiting.">
<meta name="theme-color" content="#2B1D18">
<title>E.Praise Couture's — The Homebase of Luxury</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%232B1D18'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='28' fill='%23F6EFE9' text-anchor='middle'%3EEP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   E.PRAISE COUTURE'S
   Palette — exactly three colours:
   --clay  #F6EFE9  background
   --ink   #2B1D18  primary
   --rust  #B4552D  secondary / accent
   ============================================================ */
:root{
  --clay:#F6EFE9;
  --ink:#2B1D18;
  --rust:#B4552D;

  --ink-72:rgba(43,29,24,.72);
  --ink-55:rgba(43,29,24,.55);
  --ink-38:rgba(43,29,24,.38);
  --ink-20:rgba(43,29,24,.20);
  --ink-10:rgba(43,29,24,.10);
  --clay-72:rgba(246,239,233,.72);
  --clay-55:rgba(246,239,233,.55);
  --clay-20:rgba(246,239,233,.20);
  --clay-10:rgba(246,239,233,.10);

  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;

  --pad:clamp(20px,5vw,64px);
  --section:clamp(64px,9vw,140px);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--clay);color:var(--ink);
  font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body.is-locked{overflow:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--rust);color:var(--clay)}
:focus-visible{outline:1px solid var(--rust);outline-offset:4px}

h1,h2,h3,h4{font-family:var(--serif);font-weight:300;line-height:1.02;letter-spacing:-.012em;margin:0}
h1{font-size:clamp(42px,7.2vw,100px)}
h2{font-size:clamp(32px,4.6vw,64px)}
h3{font-size:clamp(22px,2.3vw,30px);line-height:1.12}
p{margin:0 0 1.1em}
p:last-child{margin-bottom:0}

.wrap{max-width:1320px;margin:0 auto;padding-inline:var(--pad)}
.narrow{max-width:820px}
.rule{height:1px;border:0;background:var(--ink-20);margin:0}
.eyebrow{
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  font-weight:500;color:var(--rust);display:inline-block;
}
.eyebrow.on-dark{color:var(--rust)}
.section-label{
  display:flex;align-items:baseline;gap:14px;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-55);
  margin-bottom:34px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--ink-20);transform:translateY(-3px)}
.section-label .n{color:var(--rust)}
.on-dark .section-label{color:var(--clay-55)}
.on-dark .section-label::after{background:var(--clay-20)}
.muted{color:var(--ink-55)}
.italic{font-style:italic}
.center{text-align:center}

/* ---------- buttons ---------- */
.btn{
  --bg:transparent;--fg:var(--ink);--bd:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--bg);color:var(--fg);border:1px solid var(--bd);
  padding:17px 32px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  font-weight:500;line-height:1;border-radius:0;
  transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease);
  white-space:nowrap;
}
.btn:hover{--bg:var(--ink);--fg:var(--clay)}
.btn--solid{--bg:var(--ink);--fg:var(--clay);--bd:var(--ink)}
.btn--solid:hover{--bg:transparent;--fg:var(--ink)}
.btn--light{--bg:var(--clay);--fg:var(--ink);--bd:var(--clay)}
.btn--light:hover{--bg:transparent;--fg:var(--clay)}
.btn--ghost{--bg:transparent;--fg:var(--clay);--bd:var(--clay-55)}
.btn--ghost:hover{--bg:var(--clay);--fg:var(--ink);--bd:var(--clay)}
.btn--rust{--bg:var(--rust);--fg:var(--clay);--bd:var(--rust)}
.btn--rust:hover{--bg:transparent;--fg:var(--rust)}
.btn--block{width:100%}
.link-u{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  border-bottom:1px solid var(--rust);padding-bottom:4px;
  transition:color .3s var(--ease),border-color .3s var(--ease);
}
.link-u:hover{color:var(--rust)}

/* ---------- header ---------- */
.topbar{
  background:var(--ink);color:var(--clay-72);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  text-align:center;padding:11px 20px;position:relative;z-index:60;
}
.topbar b{color:var(--clay);font-weight:500}
.topbar .dot{color:var(--rust);padding:0 10px}
.topbar .tb-extra{display:inline}

.site-head{
  position:sticky;top:0;z-index:50;
  background:var(--clay);
  border-bottom:1px solid transparent;
  transition:border-color .4s var(--ease),background .4s var(--ease);
}
.site-head.is-scrolled{border-bottom-color:var(--ink-20)}
.head-inner{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;
  height:86px;
}
.brand{display:flex;flex-direction:column;gap:5px;justify-self:start;line-height:1}
.brand .b1{
  font-family:var(--serif);font-size:22px;letter-spacing:.2em;font-weight:400;
  text-transform:uppercase;
}
.brand .b2{
  font-size:7.5px;letter-spacing:.46em;text-transform:uppercase;color:var(--ink-55);
  padding-left:2px;
}
.nav{display:flex;gap:30px;justify-self:center}
.nav a{
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;
  padding:6px 0;position:relative;color:var(--ink-72);
  transition:color .3s var(--ease);
}
.nav a::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
  background:var(--rust);transition:width .35s var(--ease);
}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink)}
.nav a:hover::after,.nav a[aria-current="page"]::after{width:100%}
.head-actions{display:flex;align-items:center;gap:18px;justify-self:end}
.head-actions .btn{padding:13px 22px;font-size:9.5px;letter-spacing:.18em}
.burger{
  display:none;width:44px;height:44px;border:1px solid var(--ink-20);
  align-items:center;justify-content:center;flex-direction:column;gap:5px;
}
.burger span{display:block;width:18px;height:1px;background:var(--ink);transition:transform .3s var(--ease),opacity .3s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* mobile menu */
.mobile-menu{
  position:fixed;inset:0;z-index:80;background:var(--clay);
  padding:24px var(--pad) 32px;display:none;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease);
}
.mobile-menu.is-open{opacity:1;pointer-events:auto}
.mobile-menu .mm-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--ink-20)}
.mm-close{font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:10px 0}
.mobile-menu nav{display:flex;flex-direction:column;flex:1;justify-content:center;gap:4px}
.mobile-menu nav a{
  font-family:var(--serif);font-size:clamp(30px,8vw,44px);font-weight:300;
  padding:9px 0;border-bottom:1px solid var(--ink-10);
}
.mobile-menu nav a span{font-size:10px;letter-spacing:.2em;font-family:var(--sans);color:var(--rust);vertical-align:super;margin-left:8px}
.mobile-menu .mm-foot{display:flex;flex-direction:column;gap:14px;padding-top:20px}
.mobile-menu .mm-meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-55)}

/* ---------- views ---------- */
.view{display:none}
.view.is-active{display:block;animation:viewIn .5s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* ---------- hero ---------- */
.hero{
  position:relative;background:var(--ink);color:var(--clay);
  min-height:calc(100svh - 86px);display:flex;align-items:center;
  padding:clamp(60px,10vw,120px) 0 clamp(80px,12vw,140px);
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(135deg, rgba(246,239,233,.03) 0 1px, transparent 1px 6px);
}
.hero::after{
  content:"";position:absolute;right:-18vw;bottom:-30vw;width:78vw;height:78vw;
  background:radial-gradient(circle, rgba(180,85,45,.14) 0%, rgba(180,85,45,.05) 42%, transparent 70%);
  pointer-events:none;
}
.hero-inner{position:relative;z-index:2;width:100%}
.hero-photo{position:absolute;inset:0;z-index:0;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 32%}
.hero-photo::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(43,29,24,.72) 0%, rgba(43,29,24,.55) 45%, rgba(43,29,24,.86) 100%);
}
.hero.has-photo::before{opacity:.4}
.hero .ghost{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  font-family:var(--serif);font-size:clamp(104px,25vw,360px);line-height:.8;
  color:rgba(246,239,233,.038);letter-spacing:.01em;white-space:nowrap;
  pointer-events:none;user-select:none;z-index:1;
}
.hero-content{position:relative;text-align:center;max-width:1040px;margin:0 auto}
.hero .kicker{
  font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--rust);
  display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:30px;
}
.hero .kicker::before,.hero .kicker::after{content:"";width:34px;height:1px;background:var(--rust);opacity:.6}
.hero h1{color:var(--clay);font-size:clamp(40px,6vw,84px)}
.hero h1 .l2{display:block;font-style:italic;font-weight:300;color:rgba(246,239,233,.86)}
.hero .tagline{
  font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:clamp(21px,3.1vw,44px);line-height:1.2;letter-spacing:-.01em;
  color:rgba(246,239,233,.82);margin:16px 0 0;
}
.hero .sub{
  margin:34px auto 0;max-width:56ch;color:var(--clay-72);font-size:clamp(14px,1.5vw,16.5px);
  line-height:1.8;
}
.hero .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:40px}
.hero-meta{
  position:relative;z-index:2;margin-top:clamp(48px,7vw,88px);
  display:flex;justify-content:center;flex-wrap:wrap;gap:0;
  border-top:1px solid var(--clay-20);
}
.hero-meta div{
  padding:20px 34px;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--clay-55);
  border-right:1px solid var(--clay-20);
}
.hero-meta div:last-child{border-right:0}
.hero-meta b{display:block;font-family:var(--serif);font-size:19px;letter-spacing:.02em;color:var(--clay);text-transform:none;margin-bottom:4px;font-weight:400}
.hero-side{
  position:absolute;right:calc(var(--pad) * .55);top:50%;transform:translateY(-50%) rotate(180deg);
  writing-mode:vertical-rl;font-size:9px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--clay-55);z-index:3;
}
.scroll-cue{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3;
  font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--clay-55);
}
.scroll-cue i{display:block;width:1px;height:44px;background:linear-gradient(to bottom,var(--clay-55),transparent);position:relative;overflow:hidden}
.scroll-cue i::after{content:"";position:absolute;left:0;top:-44px;width:1px;height:22px;background:var(--rust);animation:cue 2.4s var(--ease) infinite}
@keyframes cue{0%{top:-24px}70%,100%{top:48px}}

/* ---------- statement ---------- */
.statement{padding:var(--section) 0}
.statement-inner{max-width:900px;margin:0 auto;text-align:center}
.statement h2{font-size:clamp(28px,3.5vw,46px);line-height:1.25;font-weight:300}
.statement h2 em{font-style:italic;color:var(--rust)}
.signature{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:14px}
.signature .hair{width:56px;height:1px;background:var(--rust)}
.signature .name{font-family:var(--serif);font-size:19px;letter-spacing:.14em;text-transform:uppercase}
.signature .role{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-55)}

/* ---------- collection cards ---------- */
.collections{padding:0 0 var(--section)}
.sec-head{
  display:flex;justify-content:space-between;align-items:flex-end;gap:32px;
  flex-wrap:wrap;margin-bottom:44px;
}
.sec-head .lede{max-width:44ch;color:var(--ink-55);font-size:14.5px;margin:10px 0 0}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.card{display:block;position:relative}
.card .frame{position:relative;overflow:hidden;background:var(--ink-10)}
.card .frame::after{
  content:"";position:absolute;inset:0;border:1px solid var(--ink-10);pointer-events:none;
}
.card .meta{padding-top:16px;display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.card .meta h3{font-size:23px}
.card .meta .season{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-55);white-space:nowrap}
.card .cap{font-size:12.5px;color:var(--ink-55);margin-top:4px;max-width:32ch}
.card .arrow{
  position:absolute;right:14px;top:14px;width:36px;height:36px;background:var(--clay);
  display:grid;place-items:center;opacity:0;transform:translateY(-4px);
  transition:opacity .35s var(--ease),transform .35s var(--ease);z-index:2;
}
.card:hover .arrow{opacity:1;transform:none}
.card .arrow svg{width:13px;height:13px}
.card:hover h3{color:var(--rust)}

/* ---------- photo placeholder system ---------- */
.photo{
  position:relative;width:100%;overflow:hidden;
  background-color:#E6D8CA;
  background-image:
    repeating-linear-gradient(135deg, rgba(43,29,24,.055) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(45deg, rgba(43,29,24,.03) 0 1px, transparent 1px 6px);
}
.photo[data-tone="1"]{background-color:#E9DCCE}
.photo[data-tone="2"]{background-color:#DFCDBC}
.photo[data-tone="3"]{background-color:#D3BBA6}
.photo[data-tone="4"]{background-color:#C9AB92}
.photo[data-tone="5"]{background-color:#BF9C80}
.photo[data-tone="6"]{background-color:#E3D2C1}
.photo.r45{aspect-ratio:4/5}
.photo.r11{aspect-ratio:1/1}
.photo.r34{aspect-ratio:3/4}
.photo.r169{aspect-ratio:16/9}
.photo.r32{aspect-ratio:3/2}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;z-index:2}
.photo .ph-no{
  position:absolute;left:18px;top:14px;font-family:var(--serif);font-size:13px;
  letter-spacing:.16em;color:var(--ink-38);z-index:1;
}
.photo .ph-mark{
  position:absolute;left:18px;bottom:16px;font-size:8px;letter-spacing:.34em;
  text-transform:uppercase;color:var(--ink-38);z-index:1;
}
.photo .ph-word{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-size:clamp(27px,4.2vw,42px);line-height:1;
  color:rgba(43,29,24,.085);letter-spacing:-.02em;z-index:1;white-space:nowrap;
  padding:0 12px;
}
.photo::after{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(43,29,24,.10);
}
.card .photo{transition:transform .8s var(--ease)}
.card:hover .photo{transform:scale(1.025)}

/* ---------- fabric house ---------- */
.fabric-house{background:var(--ink);color:var(--clay);padding:var(--section) 0;position:relative;overflow:hidden}
.fabric-house::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg, rgba(246,239,233,.028) 0 1px, transparent 1px 8px);
}
.fabric-house .wrap{position:relative;z-index:2}
.fabric-house .sec-head .lede{color:var(--clay-55)}
.fabric-house .sec-head h2{color:var(--clay)}
.fabric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--clay-20);border:1px solid var(--clay-20)}
.fabric{
  background:var(--ink);padding:30px 28px 32px;display:flex;flex-direction:column;gap:20px;
  transition:background .4s var(--ease);
}
.fabric:hover{background:rgba(246,239,233,.035)}
.swatch{
  height:112px;position:relative;background:var(--clay);
  box-shadow:inset 0 0 0 1px rgba(43,29,24,.12);
}
.swatch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.swatch::after{
  content:"";position:absolute;inset:14px;border:1px dashed rgba(43,29,24,.18);z-index:2;pointer-events:none;
}
.fabric .f-no{font-size:9px;letter-spacing:.26em;color:var(--rust)}
.fabric h3{color:var(--clay);font-size:25px}
.fabric .f-weight{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--clay-55)}
.fabric p{font-size:13px;color:var(--clay-55);line-height:1.65;margin:0}
.fabric .f-actions{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--clay-20)}
.fabric .f-link{
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--clay);
  border-bottom:1px solid var(--rust);padding-bottom:3px;transition:color .3s;
}
.fabric .f-link:hover{color:var(--rust)}
.fabric .f-price{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay-55)}

/* light variant — used on the collections page */
.fabric-grid--light{background:var(--ink-20);border:1px solid var(--ink-20);margin-bottom:var(--section)}
.fabric--light{background:var(--clay)}
.fabric--light:hover{background:rgba(43,29,24,.028)}
.fabric--light h3{color:var(--ink)}
.fabric--light .f-weight,.fabric--light p,.fabric--light .f-price{color:var(--ink-55)}
.fabric--light .f-link{color:var(--ink)}
.fabric--light .f-link:hover{color:var(--rust)}
.fabric--light .f-actions{border-top-color:var(--ink-20)}

/* swatch weaves */
.swatch[data-weave="cashmere"]{background-color:#DCCDBD;background-image:
  repeating-linear-gradient(0deg,rgba(43,29,24,.10) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(43,29,24,.06) 0 1px,transparent 1px 4px)}
.swatch[data-weave="jonkoso"]{background-color:#C99C74;background-image:
  repeating-linear-gradient(45deg,rgba(43,29,24,.14) 0 2px,transparent 2px 5px),
  repeating-linear-gradient(-45deg,rgba(180,85,45,.28) 0 1px,transparent 1px 6px)}
.swatch[data-weave="tetsi"]{background-color:#B98A62;background-image:
  repeating-linear-gradient(90deg,rgba(43,29,24,.18) 0 2px,transparent 2px 6px),
  repeating-linear-gradient(0deg,rgba(246,239,233,.22) 0 1px,transparent 1px 6px)}
.swatch[data-weave="vucano"]{background-color:#8E7A6B;background-image:
  repeating-linear-gradient(135deg,rgba(246,239,233,.16) 0 1px,transparent 1px 4px),
  repeating-linear-gradient(45deg,rgba(43,29,24,.16) 0 1px,transparent 1px 5px)}
.swatch[data-weave="suiting"]{background-color:#6E5747;background-image:
  repeating-linear-gradient(90deg,rgba(246,239,233,.14) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(0deg,rgba(43,29,24,.22) 0 1px,transparent 1px 3px)}
.swatch[data-weave="trims"]{background-color:#E6D6C4;background-image:
  radial-gradient(circle at 50% 50%,rgba(43,29,24,.18) 1px,transparent 1.4px);
  background-size:9px 9px}

/* ---------- split / house ---------- */
.house{padding:var(--section) 0;scroll-margin-top:104px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,86px);align-items:center}
.split .copy h2{margin-bottom:22px}
.split .copy p{color:var(--ink-72);font-size:15px;line-height:1.85;max-width:52ch}
.split .copy .btn{margin-top:14px}
.house-facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ink-20);border:1px solid var(--ink-20);margin-top:32px}
.house-facts div{background:var(--clay);padding:18px 20px}
.house-facts dt{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--rust);margin-bottom:5px}
.house-facts dd{margin:0;font-family:var(--serif);font-size:18px;line-height:1.3}

/* ---------- featured ---------- */
.featured{padding:0 0 var(--section)}
.featured-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;align-items:start}
.featured-grid .card:nth-child(2){margin-top:0}
.card--bare .frame{margin-bottom:0}

/* ---------- testimonials ---------- */
.testimonials{background:var(--clay);padding:0 0 var(--section);border-top:1px solid var(--ink-20);padding-top:var(--section)}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
.quote{border-top:1px solid var(--ink);padding-top:26px;position:relative}
.quote .qm{font-family:var(--serif);font-size:54px;line-height:.6;color:var(--rust);display:block;margin-bottom:16px}
.quote blockquote{
  margin:0;font-family:var(--serif);font-size:23px;line-height:1.42;font-style:italic;
  color:var(--ink);font-weight:300;
}
.quote .who{margin-top:22px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-55)}
.quote .who b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px;letter-spacing:.18em}

/* ---------- booking ---------- */
.booking{background:var(--ink);color:var(--clay);padding:var(--section) 0;position:relative;overflow:hidden}
.booking::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 12% 20%, rgba(180,85,45,.18), transparent 55%);
  pointer-events:none;
}
.booking .wrap{position:relative;z-index:2}
.booking-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,6vw,90px);align-items:start}
.booking h2{color:var(--clay);margin-bottom:20px}
.booking .lead{color:var(--clay-72);font-size:15px;max-width:42ch;margin-bottom:30px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{
  counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:16px;
  padding:17px 0;border-top:1px solid var(--clay-20);align-items:baseline;
}
.steps li::before{
  content:"0" counter(s);font-family:var(--serif);font-size:13px;color:var(--rust);
  letter-spacing:.06em;
}
.steps b{display:block;font-family:var(--serif);font-size:20px;font-weight:400;margin-bottom:3px;color:var(--clay)}
.steps span{font-size:13px;color:var(--clay-55);line-height:1.6}
.booking .phone-line{margin-top:28px;font-size:12px;letter-spacing:.06em;color:var(--clay-55)}
.booking .phone-line a{color:var(--clay);border-bottom:1px solid var(--rust);padding-bottom:2px}

/* forms */
.form{background:rgba(246,239,233,.04);border:1px solid var(--clay-20);padding:clamp(24px,3.4vw,42px)}
.form h3{color:var(--clay);font-size:27px;margin-bottom:6px}
.form .f-sub{font-size:12.5px;color:var(--clay-55);margin-bottom:26px}
.field{margin-bottom:18px}
.field label{
  display:block;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--clay-55);margin-bottom:8px;
}
.field input,.field select,.field textarea{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--clay-20);
  color:var(--clay);padding:11px 0;font-family:var(--sans);font-size:15px;border-radius:0;
  transition:border-color .3s var(--ease);
}
.field input::placeholder,.field textarea::placeholder{color:rgba(246,239,233,.28)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--rust)}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--clay-55) 50%),linear-gradient(135deg,var(--clay-55) 50%,transparent 50%);background-position:calc(100% - 11px) 20px,calc(100% - 6px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field select option{background:var(--ink);color:var(--clay)}
.field textarea{resize:vertical;min-height:74px}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form .btn{margin-top:10px}
.form .fine{font-size:11px;color:var(--clay-55);margin-top:14px;line-height:1.6}
.form-note{
  display:none;margin-top:16px;font-size:12.5px;color:var(--rust);
  border-left:2px solid var(--rust);padding-left:12px;
}
.form-note.is-on{display:block}

/* ---------- footer ---------- */
.site-foot{background:var(--ink);color:var(--clay-72);border-top:1px solid var(--clay-20);padding:70px 0 30px}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:40px}
.foot-brand .b1{font-family:var(--serif);font-size:24px;letter-spacing:.2em;color:var(--clay);text-transform:uppercase}
.foot-brand .b2{font-size:7.5px;letter-spacing:.46em;text-transform:uppercase;color:var(--clay-55);margin-bottom:18px}
.foot-brand p{font-size:13px;max-width:30ch;color:var(--clay-55);line-height:1.75}
.foot-col h4{font-family:var(--sans);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--rust);font-weight:500;margin-bottom:18px}
.foot-col ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.foot-col a,.foot-col li{font-size:13px;color:var(--clay-72);transition:color .3s}
.foot-col a:hover{color:var(--clay)}
.foot-social{display:flex;gap:18px;margin-top:18px}
.foot-social a{font-size:10px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--clay-20);padding-bottom:3px}
.foot-social a:hover{border-color:var(--rust)}
.newsletter{display:flex;border-bottom:1px solid var(--clay-20);margin-top:14px}
.newsletter input{flex:1;background:transparent;border:0;color:var(--clay);font-size:13px;padding:10px 0;font-family:var(--sans)}
.newsletter input::placeholder{color:rgba(246,239,233,.3)}
.newsletter input:focus{outline:none}
.newsletter button{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--rust);padding:0 4px}
.foot-base{
  margin-top:54px;padding-top:22px;border-top:1px solid var(--clay-20);
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay-55);
}
.foot-base a:hover{color:var(--clay)}

/* ---------- mobile sticky CTA ---------- */
.sticky-cta{
  position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;
  background:var(--ink);border-top:1px solid rgba(246,239,233,.2);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .4s var(--ease);
}
.sticky-cta.is-on{transform:none}
.sticky-cta .btn{width:100%;padding:15px;font-size:10px}
.sticky-cta .wa{
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);
}
.sticky-cta .wa svg{width:14px;height:14px}

/* ---------- collections view ---------- */
.page-head{padding:clamp(48px,7vw,88px) 0 clamp(32px,4vw,48px)}
.page-head .crumbs{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-55);margin-bottom:20px}
.page-head .crumbs a:hover{color:var(--rust)}
.page-head h1{font-size:clamp(40px,6vw,78px);max-width:16ch}
.page-head .lede{color:var(--ink-55);max-width:52ch;margin-top:18px;font-size:15px}
.filters{
  display:flex;gap:10px;flex-wrap:wrap;padding:0 0 28px;margin-bottom:34px;
  border-bottom:1px solid var(--ink-20);
}
.filter{
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;padding:11px 18px;
  border:1px solid var(--ink-20);color:var(--ink-55);transition:all .3s var(--ease);
}
.filter:hover{border-color:var(--ink);color:var(--ink)}
.filter.is-on{background:var(--ink);color:var(--clay);border-color:var(--ink)}
.collection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 26px;padding-bottom:var(--section)}
.collection-grid .card.is-hidden{display:none}
.collection-grid .meta h3{font-size:21px}

/* ---------- look view ---------- */
.look{padding:clamp(32px,5vw,64px) 0 var(--section)}
.look-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.look-head .crumbs{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-55);margin-bottom:14px}
.look-head h1{font-size:clamp(36px,5vw,64px)}
.look-head .no{font-family:var(--serif);font-size:13px;letter-spacing:.2em;color:var(--rust)}
.look-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(32px,5vw,70px);align-items:start}
.look-media .photo{margin-bottom:20px;height:min(72vh,700px);aspect-ratio:auto}
.look-media .photo img{object-position:50% 32%}
.look-media .thumbs .photo{height:auto;aspect-ratio:1/1;margin-bottom:0}
.look-media .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.look-info .price{
  font-family:var(--serif);font-size:26px;display:flex;align-items:baseline;gap:10px;
  padding-bottom:20px;border-bottom:1px solid var(--ink-20);margin-bottom:20px;
}
.look-info .price small{font-family:var(--sans);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-55)}
.look-info .desc{font-size:15px;line-height:1.85;color:var(--ink-72);margin-bottom:26px}
.spec{display:grid;grid-template-columns:130px 1fr;gap:10px 16px;font-size:13.5px;margin-bottom:26px}
.spec dt{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--rust);padding-top:4px}
.spec dd{margin:0;color:var(--ink-72);line-height:1.6}
.look-actions{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.look-actions .btn{width:100%}
.wa-note{font-size:11.5px;color:var(--ink-55);line-height:1.65;text-align:center}
.related{padding:var(--section) 0 0;border-top:1px solid var(--ink-20);margin-top:clamp(48px,7vw,90px)}
.related .sec-head{margin-bottom:34px}

/* ---------- booking page ---------- */
.book-page{padding:clamp(36px,5vw,64px) 0 var(--section)}
.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,6vw,80px);align-items:start}
.book-page .form{background:transparent;border:1px solid var(--ink-20)}
.book-page .form h3{color:var(--ink)}
.book-page .form .f-sub{color:var(--ink-55)}
.book-page .field label{color:var(--ink-55)}
.book-page .field input,.book-page .field select,.book-page .field textarea{
  border-bottom-color:var(--ink-20);color:var(--ink);
}
.book-page .field input::placeholder,.book-page .field textarea::placeholder{color:var(--ink-38)}
.book-page .field select option{background:var(--clay);color:var(--ink)}
.book-page .field select{
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-55) 50%),
                   linear-gradient(135deg,var(--ink-55) 50%,transparent 50%);
  background-position:calc(100% - 11px) 20px,calc(100% - 6px) 20px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.book-page .form .fine{color:var(--ink-55)}
.atelier-card{border:1px solid var(--ink-20);padding:clamp(24px,3vw,36px);margin-bottom:24px}
.atelier-card h3{margin-bottom:18px;font-size:27px}
.atelier-card .row{padding:14px 0;border-top:1px solid var(--ink-10);display:grid;grid-template-columns:96px 1fr;gap:14px;font-size:13.5px}
.atelier-card .row:first-of-type{border-top:0}
.atelier-card .row b{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--rust);font-weight:500;padding-top:3px}
.map-frame{
  height:230px;border:1px solid var(--ink-20);position:relative;overflow:hidden;
  background-color:#E6D8CA;
  background-image:
    repeating-linear-gradient(0deg,rgba(43,29,24,.09) 0 1px,transparent 1px 34px),
    repeating-linear-gradient(90deg,rgba(43,29,24,.09) 0 1px,transparent 1px 34px),
    repeating-linear-gradient(45deg,rgba(180,85,45,.12) 0 6px,transparent 6px 60px);
}
.map-frame .pin{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.map-frame .pin i{display:block;width:12px;height:12px;background:var(--rust);border-radius:50%;box-shadow:0 0 0 6px rgba(180,85,45,.18)}
.map-frame .pin span{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;background:var(--ink);color:var(--clay);padding:6px 9px;white-space:nowrap}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .grid-3,.grid-4,.collection-grid{grid-template-columns:repeat(2,1fr)}
  .fabric-grid{grid-template-columns:repeat(2,1fr)}
  .featured-grid{grid-template-columns:repeat(2,1fr);gap:26px}
  .featured-grid .card:nth-child(2),.featured-grid .card:nth-child(4){margin-top:0}
  .quotes{grid-template-columns:1fr 1fr}
  .quotes .quote:last-child{grid-column:1/-1;max-width:560px}
  .foot-grid{grid-template-columns:1fr 1fr}
  .hero-side{display:none}
}
@media (max-width:900px){
  .nav{display:none}
  .head-inner{grid-template-columns:1fr auto;height:68px}
  .head-actions .btn{display:none}
  .burger{display:flex}
  .mobile-menu{display:flex}
  .split,.booking-grid,.look-grid,.book-grid{grid-template-columns:1fr}
  .split{gap:34px}
  .split .media{order:-1}
  .house-facts{grid-template-columns:1fr 1fr}
  .featured-grid{grid-template-columns:1fr 1fr}
  .hero{min-height:auto;padding:64px 0 90px}
  .hero .btns .btn{flex:1 1 auto}
  .hero-meta{flex-direction:column;border-top:1px solid var(--clay-20)}
  .hero-meta div{width:100%;border-right:0 !important;border-bottom:1px solid var(--clay-20);padding:14px 0;display:flex;align-items:baseline;gap:14px}
  .hero-meta div:last-child{border-bottom:0}
  .hero-meta b{font-size:15px;margin-bottom:0;min-width:96px}
  .look-head{flex-direction:column;align-items:flex-start;gap:10px}
  .look-head .no{margin-top:2px}
  .scroll-cue{display:none}
  .sticky-cta{display:block}
  .site-foot{padding-bottom:96px}
  .statement{padding:64px 0}
  .testimonials{padding-top:64px}
  .section-label{margin-bottom:24px}
  .booking{padding:64px 0}
  .quotes{grid-template-columns:1fr;gap:30px}
  .quotes .quote:last-child{grid-column:auto}
}
@media (max-width:620px){
  .grid-3,.grid-4,.collection-grid,.fabric-grid,.featured-grid{grid-template-columns:1fr}
  .featured-grid .card:nth-child(2),.featured-grid .card:nth-child(4){margin-top:0}
  .foot-grid{grid-template-columns:1fr;gap:34px}
  .field-2{grid-template-columns:1fr}
  .house-facts{grid-template-columns:1fr}
  .hero .kicker{font-size:8.5px;letter-spacing:.26em}
  .hero .kicker::before,.hero .kicker::after{width:18px}
  .page-head h1{max-width:100%}
  .look-info .price{font-size:22px}
  .atelier-card .row{grid-template-columns:1fr;gap:4px}
  .spec{grid-template-columns:1fr;gap:4px}
  .spec dt{padding-top:10px}
  .card .meta{flex-direction:column;gap:2px}
  .topbar{font-size:8.5px;letter-spacing:.12em;padding:9px 12px}
  .topbar .tb-extra{display:none}
}
</style>
</head>

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s="") => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function waLink(message){
  return "https://wa.me/" + CONFIG.phone + "?text=" + encodeURIComponent(message);
}
function lookById(id){ return LOOKS.find(l => l.id === id); }
function collectionById(id){ return COLLECTIONS.find(c => c.id === id); }
function collectionName(id){ const c = collectionById(id); return c ? c.name : "Couture"; }

function photo(o, ratio, extra=""){
  const img = o.image
    ? '<img src="'+esc(o.image)+'" alt="'+esc(o.name)+' — '+esc(o.subtitle||"")+'" loading="lazy"'
      + (o.pos ? ' style="object-position:'+o.pos+'"' : '') + '>'
    : '';

const app = $("#app");

function parseHash(){
  let h = location.hash.replace(/^#/, "") || "/";
  const [pathPart, queryPart] = h.split("?");
  const params = new URLSearchParams(queryPart || "");
  return { path: pathPart || "/", params };
}

let currentPath = "/";

function render(){
  const { path, params } = parseHash();
  closeMenu();

  let html = "";
  let navKey = "";
  let scrollTo = null;

  if(path === "/" || path === ""){
    html = viewHome(); navKey = "house";
  } else if(path.startsWith("/#")){
    html = viewHome(); navKey = "house"; scrollTo = path.slice(2);
  } else if(path === "/collections"){
    html = viewCollections(params.get("filter")); navKey = params.get("filter") === "fabrics" ? "fabrics" : "collections";
  } else if(path.startsWith("/look/")){
    html = viewLook(path.split("/")[2]); navKey = "collections";
  } else if(path === "/book"){
    html = viewBook(); navKey = "book";
  } else {
    html = viewHome(); navKey = "house";
  }

  currentPath = path;
  app.innerHTML = `<div class="view is-active">${html}</div>`;

  $$("[data-nav]").forEach(a => {
    if(a.dataset.nav === navKey) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });

  app.querySelectorAll('a[href^="#/"]').forEach(a => {
    a.addEventListener("click", () => { window.scrollTo({top:0, behavior:"auto"}); });
  });

  bindForm();
  syncChrome();

  if(scrollTo){
    const target = document.getElementById(scrollTo);
    if(target) requestAnimationFrame(() => target.scrollIntoView({behavior:"auto"}));
  }
}

function bindForm(){
  const form = document.getElementById("bookingForm");
  if(!form) return;
  form.addEventListener("submit", e => {
    e.preventDefault();
    const note = $("#formNote");
    const data = Object.fromEntries(new FormData(form).entries());

    if(!data.name || data.name.trim().length < 2){
      note.textContent = "Please add your name so we know who we are speaking to.";
      note.classList.add("is-on"); $("#f-name").focus(); return;
    }
    if(!data.phone || data.phone.replace(/\D/g,"").length < 7){
      note.textContent = "Please add a phone or WhatsApp number we can reply to.";
      note.classList.add("is-on"); $("#f-phone").focus(); return;
    }

    const lines = [
      ["Name", data.name],
      ["Phone", data.phone],
      ["Service", data.service],
      ["Occasion", data.occasion],
      ["Date needed", data.date],
      ["Budget", data.budget],
      ["Notes", data.notes]
    ].filter(([,v]) => v && String(v).trim());

    const body = lines.map(([k,v]) => k + ": " + v).join("\n");
    window.open(waLink("New appointment request — E.Praise Couture's\n\n" + body), "_blank", "noopener");
    note.textContent = "WhatsApp is opening with your request. If it does not, message us directly on " + CONFIG.phoneShow + ".";
    note.classList.add("is-on");
  });
}

/* header / sticky behaviour */
function syncChrome(){
  const head = $("#siteHead");
  const y = window.scrollY;
  head.classList.toggle("is-scrolled", y > 8);

  const sticky = $("#stickyCta");
  if(currentPath === "/book"){ sticky.classList.remove("is-on"); return; }
  const hero = document.querySelector(".hero");
  const past = hero ? hero.getBoundingClientRect().bottom < 60 : y > window.innerHeight * 0.55;
  sticky.classList.toggle("is-on", past);
}

/* mobile menu */
const burger = $("#burger"), menu = $("#mobileMenu");
function openMenu(){
  menu.classList.add("is-open");
  menu.setAttribute("aria-hidden","false");
  burger.setAttribute("aria-expanded","true");
  burger.setAttribute("aria-label","Close menu");
  document.body.classList.add("is-locked");
}
function closeMenu(){
  menu.classList.remove("is-open");
  menu.setAttribute("aria-hidden","true");
  burger.setAttribute("aria-expanded","false");
  burger.setAttribute("aria-label","Open menu");
  document.body.classList.remove("is-locked");
}
burger.addEventListener("click", () => menu.classList.contains("is-open") ? closeMenu() : openMenu());
$("#mmClose").addEventListener("click", closeMenu);
menu.addEventListener("click", e => { if(e.target.closest("a")) closeMenu(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeMenu(); });

window.addEventListener("scroll", syncChrome, {passive:true});
window.addEventListener("resize", syncChrome);
window.addEventListener("hashchange", render);

renderFooter();
render();
if(!location.hash) history.replaceState(null, "", "#/");
</script>
</body>
</html>
